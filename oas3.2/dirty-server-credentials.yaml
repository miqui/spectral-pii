openapi: 3.2.0
info:
  title: Dirty Server Credentials Service
  summary: Fixture exercising pii-credentials-in-server-url
  description: Fixture API exercising the pii-credentials-in-server-url rule.
  version: 1.0.0
  contact:
    name: Fixture Team
    url: https://api.example.com/support
servers:
  - url: "https://ci-user:s3cretToken@example.com/v1"
tags:
  - name: status
    description: Status operations
paths:
  /status:
    get:
      operationId: getStatus
      tags:
        - status
      summary: Get status
      description: Returns service status.
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
components:
  schemas:
    Status:
      type: object
      properties:
        ok:
          type: boolean
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
