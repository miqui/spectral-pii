openapi: 3.2.0
info:
  title: Dirty Example Secrets Service
  summary: Fixture exercising example-scanner secret mode
  description: Fixture API exercising example-scanner secret mode.
  version: 1.0.0
  contact:
    name: Fixture Team
    url: https://api.example.com/support
servers:
  - url: https://api.example.com/v1
tags:
  - name: credentials
    description: Credential operations
paths:
  /credentials:
    post:
      operationId: createCredential
      tags:
        - credentials
      summary: Create a credential
      description: Creates a credential record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credential"
            examples:
              sample:
                summary: Sample credential
                value:
                  token: "eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxIn0.c2ln" # betterleaks:allow synthetic test double
                  aws_key: "AKIAABCDEFGHIJKLMNOP"
                  api_key: "sk_live_abcdefghij1234567890" # betterleaks:allow synthetic test double
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
components:
  schemas:
    Credential:
      type: object
      properties:
        token:
          type: string
        aws_key:
          type: string
        api_key:
          type: string
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
