openapi: 3.2.0
info:
  title: Dirty Naming Service
  summary: Fixture exercising pii-property-name
  description: Fixture API exercising the pii-property-name rule.
  version: 1.0.0
  contact:
    name: Fixture Team
    url: https://api.example.com/support
servers:
  - url: https://api.example.com/v1
tags:
  - name: contacts
    description: Contact operations
paths:
  /contacts:
    get:
      operationId: listContacts
      tags:
        - contacts
      summary: List contacts
      description: Returns contacts.
      responses:
        "200":
          description: A list of contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contact"
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
components:
  schemas:
    Contact:
      type: object
      properties:
        id:
          type: string
          format: uuid
        first_name:
          type: string
        date_of_birth:
          type: string
        credit_card:
          type: string
      required:
        - id
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
