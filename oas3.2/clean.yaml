openapi: 3.2.0
info:
  title: Widget Service
  summary: A minimal widget catalog API
  description: A minimal catalog API for browsing widgets.
  version: 1.0.0
  contact:
    name: Widget API Team
    url: https://api.example.com/support
servers:
  - url: https://api.example.com/v1
tags:
  - name: widgets
    description: Widget catalog operations
paths:
  /widgets:
    get:
      operationId: listWidgets
      tags:
        - widgets
      summary: List widgets
      description: Returns the full list of widgets in the catalog.
      responses:
        "200":
          description: A list of widgets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Widget"
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
components:
  schemas:
    Widget:
      type: object
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
      required:
        - id
        - label
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
