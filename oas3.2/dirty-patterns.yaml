openapi: 3.2.0
info:
  title: Dirty Patterns Service
  summary: Fixture exercising pii-pattern-hint
  description: Fixture API exercising the pii-pattern-hint rule.
  version: 1.0.0
  contact:
    name: Fixture Team
    url: https://api.example.com/support
servers:
  - url: https://api.example.com/v1
tags:
  - name: documents
    description: Document operations
paths:
  /documents:
    get:
      operationId: listDocuments
      tags:
        - documents
      summary: List documents
      description: Returns documents.
      responses:
        "200":
          description: A list of documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentRecord"
        default:
          description: Unexpected error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
components:
  schemas:
    DocumentRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        id_document:
          type: string
          pattern: "^\\d{3}-\\d{2}-\\d{4}$"
        card:
          type: string
          pattern: "^\\d{4}[ -]?\\d{4}[ -]?\\d{4}[ -]?\\d{4}$"
      required:
        - id
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
